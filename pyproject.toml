[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evolution-framework"
dynamic = ["version"]
description = "Project-local governance, learning, and human-reviewed progression for AI agents"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
license = "LicenseRef-PolyForm-Internal-Use-1.0.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  {name = "WEBDIGIT SRL", email = "hello@webdigit.be"}
]
maintainers = [
  {name = "WEBDIGIT SRL", email = "hello@webdigit.be"}
]
keywords = ["agents", "governance", "evaluation", "learning", "claude"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "jsonschema>=4,<5"
]

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "check-wheel-contents>=0.6,<1",
  "pytest>=8,<9",
  "twine>=6,<8",
]

[project.urls]
Homepage = "https://github.com/webdigit/agent-evolution-framework"
Documentation = "https://github.com/webdigit/agent-evolution-framework/tree/main/docs"
Issues = "https://github.com/webdigit/agent-evolution-framework/issues"
Source = "https://github.com/webdigit/agent-evolution-framework"

[project.scripts]
aef = "aef.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "aef._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aef.schemas" = ["*.json"]
